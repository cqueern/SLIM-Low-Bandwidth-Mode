name: Manual Daybreak Blue security scan

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slim-daybreak-blue-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"

      - name: Install Codex Security CLI
        run: |
          set -euo pipefail
          npm install \
            --prefix "$RUNNER_TEMP/codex-security" \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            @openai/codex-security@0.1.29
          "$RUNNER_TEMP/codex-security/node_modules/.bin/codex-security" --version

      - name: Check out the requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Scan with Daybreak Blue
        env:
          OPENAI_API_KEY: ${{ secrets.CODEX_SECURITY_API_KEY }}
          CODEX_SECURITY_BIN: ${{ runner.temp }}/codex-security/node_modules/.bin/codex-security
          CODEX_SECURITY_STATE_DIR: ${{ runner.temp }}/daybreak-state
          SCAN_DIR: ${{ runner.temp }}/daybreak-results
          JSON_FILE: ${{ runner.temp }}/daybreak-scan.json
          METADATA_FILE: ${{ runner.temp }}/daybreak-metadata.txt
        run: |
          set -euo pipefail
          if [[ -z "${OPENAI_API_KEY:-}" ]]; then
            echo "Add the repository Actions secret CODEX_SECURITY_API_KEY before running this workflow." >&2
            exit 2
          fi

          scanned_sha="$(git rev-parse HEAD)"
          test "$scanned_sha" = "$GITHUB_SHA"
          install -d -m 700 "$CODEX_SECURITY_STATE_DIR" "$SCAN_DIR"

          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'commit=%s\n' "$scanned_sha"
            printf 'requested_model=gpt-daybreak-blue-latest\n'
            printf 'effort=xhigh\n'
            printf 'mode=standard\n'
            printf 'started_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$METADATA_FILE"

          set +e
          "$CODEX_SECURITY_BIN" scan . \
            --mode standard \
            --model gpt-daybreak-blue-latest \
            --effort xhigh \
            --auth api-key \
            --output-dir "$SCAN_DIR" \
            --json > "$JSON_FILE"
          scan_status="$?"
          set -e

          printf 'completed_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$METADATA_FILE"
          printf 'exit_code=%s\n' "$scan_status" >> "$METADATA_FILE"
          exit "$scan_status"

      - name: Preserve private scan artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: slim-daybreak-blue-${{ github.sha }}
          path: |
            ${{ runner.temp }}/daybreak-results
            ${{ runner.temp }}/daybreak-scan.json
            ${{ runner.temp }}/daybreak-metadata.txt
          if-no-files-found: warn
          retention-days: 14
